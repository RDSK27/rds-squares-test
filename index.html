<script>
if('serviceWorker' in navigator){
  var swReg=null, swReloaded=false;
  var swHadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!swHadController || swReloaded) return;
    swReloaded=true; window.location.reload();
  });
  window.addEventListener('load', function(){
    /* sw.js?v=<app-ver>: convencion de la suite, cada version es una peticion de red distinta */
    var verEl=document.querySelector('.app-ver');
    var swUrl='sw.js?v='+encodeURIComponent(verEl?verEl.textContent.trim():Date.now());
    navigator.serviceWorker.register(swUrl, {updateViaCache:'none'}).then(function(reg){
      swReg=reg;
      reg.update();
      if(reg.waiting && navigator.serviceWorker.controller){ reg.waiting.postMessage({action:'skipWaiting'}); }
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage({action:'skipWaiting'});
          }
        });
      });
    }).catch(function(){});
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && swReg){ swReg.update(); }
  });
}
</script>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000000;overscroll-behavior:none;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:transparent;
    color:var(--negro);
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  /* El bloqueo de scroll se hace en .app (no en html/body) para que iOS pueda
     desplazar el campo INI sobre el teclado en modo standalone (PWA). */
  .app{overflow:hidden;}
  body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:#000000;z-index:-2;pointer-events:none;}
  body::after{content:"";position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:560px;max-width:100%;background:#FFFFFF;z-index:-1;pointer-events:none;}
  body.home-active::after{background:#b0b4b8;}
  .app{position:relative;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#FFFFFF;}

  /* iOS/iPad: el body tiene user-select:none (bueno para botones/juego), pero eso
     impide el foco/teclado en los campos. Se reactiva solo en inputs y selects. */
  input,select,textarea{-webkit-user-select:text;user-select:text;}

  /* ---------- Header ---------- */
  header{ width:100%; flex-shrink:0; background:#000000; border-bottom:4px solid #b03020; display:flex; flex-direction:column; align-items:center; padding:0; padding-top:env(safe-area-inset-top,0px); }
  header img{ width:100%; height:auto; display:block; margin-bottom:0; }
  .subtitle{ display:block; width:100%; box-sizing:border-box; font-size:0.58rem; letter-spacing:0.14em; color:#cfcfcf; text-transform:none; padding:8px 0 8px; text-align:center; background:#000000; }

  /* ---------- Cuerpo ---------- */
  main{flex:1;padding:8px 16px 4px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF;}

  .title{
    text-align:center;font-weight:900;letter-spacing:0.08em;line-height:1;
    font-size:2rem;color:var(--negro);text-transform:uppercase;
    margin:0;
  }

  .logo-wrap{display:flex;justify-content:center;padding:0;}
  .logo-wrap img{width:110px;width:min(30vw,110px,13svh);height:auto;display:block;margin:0 auto 2px;}

  .group-label{
    text-align:center;color:var(--tx-gris);font-weight:700;
    letter-spacing:5px;font-size:11px;text-transform:uppercase;margin:0;
  }

  .segment{
    display:flex;border-top:4px solid #b03020;background:#111;
  }
  .segment button{
    flex:1;border:0;background:transparent;color:#fff;
    font-family:inherit;font-weight:900;letter-spacing:1px;text-transform:uppercase;
    font-size:12px;height:36px;padding:0 4px;cursor:pointer;position:relative;
    border-right:3px solid #666;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,0.7);
  }
  .segment button:last-child{border-right:0;}
  .segment button.sel{background:var(--rojo);color:#fff;text-shadow:none;}
  #segEstimulo,#segEnsayos{margin-top:0;}

  /* ---------- Acciones (mas pequenas y estrechas, como en la referencia) ---------- */
  .actions{display:flex;flex-direction:column;align-items:center;gap:6px;gap:clamp(4px,1svh,8px);margin-top:clamp(20px,4svh,40px);}

  .btn-ranking { width:75%; padding:9px; background:#fff; color:#b03020; border:2px solid #b03020; font-size:0.78rem; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; text-align:center; border-radius:6px; transition:transform 0.12s; margin-top:0; }
  .btn-ranking:active{transform:translateY(3px);}

  .home-btn-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:15px; }
  .home-btn-row #btn-start-wrap{ margin:0; }
  .app-ver{ margin-top:auto; text-align:center; color:#9a9a9a; font-size:0.72rem; letter-spacing:0.12em; font-family:Arial,sans-serif; padding-top:6px; }
  .pending-sync{ display:none; margin-top:4px; text-align:center; color:#e0a030; font-size:0.68rem; letter-spacing:0.03em; font-family:Arial,sans-serif; }
  .start-wrap{ display:flex; width:fit-content; align-items:center; justify-content:center; padding:4px; border-radius:50%; background:conic-gradient(#ffffff,#9a9a9a,#e8e8e8,#5a5a5a,#ffffff,#8a8a8a,#dcdcdc,#666666,#ffffff); box-shadow:0 5px 12px rgba(0,0,0,0.6); transition:transform 0.08s, box-shadow 0.08s; }
  .start-wrap:active{ transform:translateY(3px); box-shadow:0 2px 6px rgba(0,0,0,0.6); }
  .start-btn{ width:70px; height:70px; border-radius:50%; border:none; cursor:pointer; box-shadow:inset 0 2px 4px rgba(255,255,255,0.28), inset 0 -3px 6px rgba(0,0,0,0.5); }
  .start-btn.rank-btn{ background:radial-gradient(circle at 35% 30%, #ffffff 0%, #ececec 45%, #c6c6c6 100%); display:flex; align-items:center; justify-content:center; padding:0; }
  .start-btn.rank-btn svg{ display:block; }


  footer{
    text-align:center;color:var(--tx-gris);font-weight:600;letter-spacing:2px;
    font-size:10px;text-transform:uppercase;padding:6px 12px 10px;
  }

  /* ===== Multi-pantalla ===== */
  .screen{flex:1;display:none;flex-direction:column;min-height:0;}
  .screen.active{display:flex;}

  /* Fondo metalizado (acero cepillado) SOLO en la pantalla de inicio.
     Va en el <main> del home (no en #home) porque main{background:#fff} lo taparia. */
  #home>main{
    background-color:#c4c8cc;
    background-image:
      linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,0.38) 45%,rgba(255,255,255,0) 60%),
      radial-gradient(140% 90% at 50% 0%,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0.10) 35%,rgba(255,255,255,0) 70%),
      linear-gradient(180deg,#e9ecef 0%,#c9cdd1 50%,#b0b4b8 100%);
  }

  /* Navbar inferior Inicio / Repetir */
  .navbar{display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#fff;}
  .nav-btn{flex:1;height:var(--ah);display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--rojo);color:#fff;border:0;border-radius:0;cursor:pointer;
    font-family:inherit;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:14px;}
  .nav-btn svg{width:18px;height:18px;}
  .results-actions { display:flex; flex-direction:row; gap:0; width:100%; z-index:10; border-top:4px solid #b03020; margin-top:0; }
  .game-ctrl-btn { flex:1; padding:13px; background:#111; color:#fff; border:1px solid #333; border-right:none; font-size:0.82rem; font-weight:900; letter-spacing:0.12em; cursor:pointer; text-transform:uppercase; display:flex; align-items:center; justify-content:center; }
  .game-ctrl-btn:last-child { border-right:1px solid #ddd; }

  /* ----- Ejercicio ----- */
  .game-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 14px 11px;gap:7px;background:#fff;}
  .target-row{display:flex;align-items:center;justify-content:center;gap:14px;}
  .target-cap{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px;color:var(--azul);text-align:left;line-height:1.1;}
  .target-wrap{display:flex;justify-content:center;}
  .target-box{width:72px;height:72px;border:0;display:flex;align-items:center;justify-content:center;background:#fff;flex:none;}
  .target-box svg{width:86%;height:86%;}

  .stats{display:flex;gap:8px;}
  .stat{flex:1;text-align:center;padding:2px;background:#fff;}
  .stat .k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:9px;color:#888;}
  .stat .v{font-weight:800;font-size:36px;line-height:1.05;color:var(--rojo);}
  .stat.main .v{color:var(--negro);}
  .substat{display:flex;justify-content:center;gap:16px;font-size:12px;color:#555;font-weight:600;}
  .substat b{color:var(--negro);}

  .prog-row{display:flex;align-items:center;gap:10px;}
  .trial-count{font-weight:800;font-size:15px;color:var(--negro);white-space:nowrap;min-width:44px;}
  .progress{flex:1;height:9px;background:var(--seg);border:2px solid var(--borde);}
  .progress > i{display:block;height:100%;background:var(--rojo);width:0%;transition:width .12s linear;}

  .grid-wrap{position:relative;flex:1;min-height:0;display:flex;padding:6px;box-sizing:border-box;container-type:size;}   /* v15: sin fondo negro propio: el negro es solo el de la rejilla (.grid) */
  .grid{flex:none;margin:auto;width:min(100%,62vh);height:min(100%,62vh);width:min(100cqw,100cqh);height:min(100cqw,100cqh);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:6px;touch-action:none;background:#000;padding:6px;box-sizing:border-box;border-radius:14px;}   /* v15: panel NEGRO solo bajo los cuadrados, esquinas redondeadas. v13: rejilla CUADRADA (lado = el menor entre ancho y alto disponibles) -> cuadrados, no rectangulos */
  .sq{position:relative;border-radius:14%;border:2px solid #000;background:#000;overflow:hidden;box-sizing:border-box;}   /* borde y parte vacia en negro (el cuadrado se acorta sobre el fondo negro) */
  .sq-fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:#fff;}   /* cuadrados en BLANCO */
  .sq.shr .sq-fill{background:var(--rojo);}   /* el cuadrado que se esta acortando va en ROJO */
  .sq.dead{border-color:transparent;}
  .sq.dead .sq-fill{display:none;}
  .sq-count{position:absolute;left:0;right:0;top:50%;margin-top:-70px;text-align:center;color:var(--rojo);font-weight:900;font-size:130px;line-height:1;-webkit-text-stroke:4px #fff;paint-order:stroke fill;pointer-events:none;z-index:5;}   /* rojo con borde blanco: se ve sobre blanco y sobre negro */
  .segment button[data-soon],.rank-tab[data-soon]{opacity:.38;cursor:default;}
  .segment.off,.rank-tabs.off{opacity:.35;pointer-events:none;}   /* Limite: Eliminar/Renovar y x1/x2/x4 no aplican */
  .cell.empty{background:#fff;}
  .grid.covered .cell svg{visibility:hidden;}
  .cell{border:2px solid var(--negro);display:flex;align-items:center;justify-content:center;background:#fff;}
  .cell svg{width:74%;height:74%;pointer-events:none;}
  .cell:active{background:var(--seg);}

  /* Cuenta atras */
  .count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff;z-index:20;}
  .count.on{display:flex;}
  .count span{font-weight:800;font-size:120px;color:var(--rojo);}

  /* Resultado / fallo */
  .center-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:#fff;text-align:center;}
  .res-unit{font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px;color:var(--azul);}
  .res-main{font-weight:800;font-size:64px;color:var(--rojo);line-height:.9;}
  .res-grid{display:flex;gap:10px;}
  .res-card{border:2px solid var(--borde);padding:8px 12px;min-width:86px;}
  .res-card .v{font-weight:800;font-size:22px;color:var(--negro);}
  .res-card .k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:10px;color:#888;}
  .fail-title{font-weight:800;font-size:46px;color:var(--rojo);text-transform:uppercase;line-height:.95;}
  .fail-msg{font-weight:600;font-size:16px;color:var(--negro);max-width:300px;}

  /* Ranking */
  .rank-body{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;background:#fff;}
  .rank-title{text-align:center;font-weight:800;font-size:30px;text-transform:uppercase;margin-bottom:2px;}
  .rank-sub{text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:12px;color:var(--rojo);margin-bottom:10px;}
  .rank-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--seg);}
  .rank-row .pos{font-weight:800;color:var(--rojo);text-align:center;}
  .rank-row .nm{font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .rank-row .av{font-weight:800;color:var(--negro);}
  .rank-row .tt{font-weight:600;color:#888;font-size:12px;}
  .rank-empty{text-align:center;color:#999;font-weight:600;padding:20px;}
  .cnum{font-weight:800;font-size:46px;color:var(--rojo);line-height:1;}
  .result-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 14px;background:#fff;text-align:center;}
  .res-chart{width:100%;}
  .res-chart svg{width:100%;height:auto;display:block;}
  .pos-wrap{display:none;flex-direction:column;align-items:center;gap:4px;padding:6px 16px 0;text-align:center;}
  .pos-circle{width:54px;height:54px;border-radius:50%;background:#000;color:#fff;font-weight:900;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .pos-txt{font-size:10px;font-weight:700;letter-spacing:0.04em;color:#555;}
  .save-row{display:flex;justify-content:center;padding:8px 16px 8px;}
  .save-row-inner{display:flex;align-items:stretch;justify-content:center;gap:8px;width:calc(60% + 92px);max-width:100%;}
  /* v+: S | M | T (semana, mes, todo) junto a Mostrar repetidos, misma altura */
  .per-tog{display:flex;gap:4px;flex:none;}
  .per-tog button{width:30px;padding:7px 0;font-size:0.65rem;font-weight:900;font-family:inherit;border:1px solid #bbb;background:#fff;color:#111;border-radius:4px;cursor:pointer;}
  .per-tog button.on{background:var(--rojo);color:#fff;border-color:var(--rojo);}
  .btn-save{flex:1;max-width:60%;padding:7px;background:var(--rojo);color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;font-size:0.65rem;cursor:pointer;}
  .btn-save:disabled{background:#9A9A9A;}
  .btn-rank2{flex:none;width:84px;padding:7px;background:#111;color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;font-size:0.65rem;cursor:pointer;}
  .seg-sm button{font-size:12px;padding:7px 4px;letter-spacing:1px;}
  .rank-seg-label{text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:10px;color:#999;margin:6px 0 3px;}
  .rank-screen-title { font-size:1.2rem; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#111; text-align:center; background:#fff; padding:9px 14px 7px; border-bottom:3px solid #b03020; margin-bottom:10px; }
  .rank-tabs { display:flex; margin-bottom:0; margin-top:0; }
  .rank-tab { flex:1; padding:5px 4px; font-size:0.58rem; letter-spacing:0.06em; text-align:center; cursor:pointer; color:#999; font-weight:700; text-transform:uppercase; background:#fff; border:1px solid #000; border-right:none; }
  .rank-tab:last-child { border-right:1px solid #000; }
  .rank-tab.sel { color:#fff; background:#b03020; border-color:#000; }
  .rank-full-list { background:#fff; }
  .rank-full-row { display:flex; align-items:center; gap:8px; padding:5px 14px; border-bottom:1px solid #f0f0f0; }
  .rank-full-row.rank-full-me { background:#fff2ee; box-shadow:inset 3px 0 0 #b03020; }
  .rank-full-row.rank-full-me .rank-full-name { color:#b03020; font-weight:900; }
  .rank-full-row.rank-full-me.me-grey { background:#f0f0f0; box-shadow:inset 3px 0 0 #9A9A9A; }
  .rank-full-row.rank-full-me.me-grey .rank-full-name { color:#555; }
  .rank-full-pos { font-size:0.72rem; font-weight:900; color:#555; width:22px; }
  .rank-full-pos.gold { color:#c9a227; }
  .rank-full-pos.silver { color:#8e9eab; }
  .rank-full-pos.bronze { color:#c07941; }
  .rank-full-name { flex:1; font-size:0.72rem; font-weight:700; color:#111; }
  .rank-full-ms { font-size:0.72rem; font-weight:900; color:#b03020; }
  .rank-full-date { font-size:0.5rem; color:#555; }
  .rank-full-empty { text-align:center; padding:24px; font-size:0.62rem; color:#ccc; letter-spacing:0.1em; }
  #segModoR,#segEstR,#segEnsR{margin-bottom:4px;}
  #rkList{margin-top:10px;}
  .res-quad{width:100%;height:clamp(200px,27svh,238px);display:grid;grid-template-columns:1.28fr 1fr;grid-template-rows:1.62fr 1fr;}
  .rq{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 8px;gap:2px;min-width:0;min-height:0;}
  .rq:nth-child(1){border-right:3px solid var(--rojo);border-bottom:3px solid var(--rojo);}
  .rq:nth-child(2){border-bottom:3px solid var(--rojo);}
  .rq:nth-child(3){border-right:3px solid var(--rojo);}
  .rq-k{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:10px;color:#9A9A9A;}
  .rq-v{font-weight:800;font-size:34px;line-height:1;color:var(--negro);}
  .rq-media .rq-main{font-weight:800;font-size:46px;line-height:1;color:var(--rojo);}
  @keyframes blinkop{0%,100%{opacity:1}50%{opacity:.2}}
  .blink{animation:blinkop .9s ease-in-out infinite;}
  .res-msg{font-weight:700;text-transform:none;letter-spacing:0.2px;font-size:13px;color:var(--rojo);text-align:center;}
  .res-ens{font-weight:700;font-size:15px;color:var(--negro);text-align:center;}
  .res-ens b{font-size:22px;color:var(--rojo);}
  #btn-start-wrap { display:flex; align-items:center; justify-content:center; padding:4px; margin:5px auto 3px; border-radius:50%; background:conic-gradient(#ffffff,#9a9a9a,#e8e8e8,#5a5a5a,#ffffff,#8a8a8a,#dcdcdc,#666666,#ffffff); box-shadow:0 5px 12px rgba(0,0,0,0.6); transition:transform 0.08s, box-shadow 0.08s; }
  #btn-start-wrap:active { transform:translateY(3px); box-shadow:0 2px 6px rgba(0,0,0,0.6); }
  #btn-start { width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e84030 0%, #b03020 45%, #7a1a10 100%); border:none; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; font-weight:900; font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer; position:relative; box-shadow:inset 0 2px 4px rgba(255,255,255,0.28), inset 0 -3px 6px rgba(0,0,0,0.5); transition:transform 0.08s; }
  #btn-start:active { box-shadow:inset 0 3px 7px rgba(0,0,0,0.6); }
  #user-name-bar { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 0 5px; box-sizing:border-box; gap:0; margin-top:31px; }

  /* Overlay "Ejercicio finalizado" (modal a pantalla completa, 1s antes de resultados) */
  #transition-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#111; z-index:9999; align-items:center; justify-content:center; flex-direction:column; }
  #transition-overlay.active { display:flex; }
  #transition-text { color:#fff; font-size:1.6rem; font-weight:900; font-family:Arial,sans-serif; letter-spacing:0.05em; text-align:center; text-transform:uppercase; border-top:4px solid #b03020; border-bottom:4px solid #b03020; padding:16px 30px; }
</style>

<script>
"use strict";
function $(id){ return document.getElementById(id); }
function show(id){ if(id!=='ranking' && typeof stopRankWatch==='function') stopRankWatch(); var s=document.querySelectorAll('.screen'); for(var i=0;i<s.length;i++) s[i].classList.remove('active'); $(id).classList.add('active'); document.body.classList.toggle('home-active', id==='home'); }
function two(n){ return (n<10?'0':'')+n; }
function fmtTime(ms){ var cs=Math.floor(ms/10), cc=cs%100, s=Math.floor(cs/100), sec=s%60, m=Math.floor(s/60); return m+':'+two(sec)+'.'+two(cc); }
function fmtDate(ts){ if(!ts) return ''; var d=new Date(ts); return two(d.getDate())+'/'+two(d.getMonth()+1); }
function fmtRT(ms){ return (ms/1000).toFixed(2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var AC=null;
function audioCtx(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AC.state==='suspended'){ AC.resume(); }
  }catch(e){ AC=null; }
  return AC;
}
function tone(type,f0,f1,start,dur,vol){
  var ctx=AC; if(!ctx) return;
  var o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,start);
  if(f1){ o.frequency.exponentialRampToValueAtTime(f1,start+dur); }
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(vol,start+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(start); o.stop(start+dur+0.03);
}
function sndButton(){ var c=audioCtx(); if(!c) return; tone('triangle',520,0,c.currentTime,0.055,0.16); }
function sndSymbol(){ var c=audioCtx(); if(!c) return; tone('sine',780,940,c.currentTime,0.085,0.20); }
function sndFail(){ var c=audioCtx(); if(!c) return; var t=c.currentTime; tone('square',196,0,t,0.14,0.17); tone('square',146,0,t+0.13,0.20,0.17); }


function seg(id){
  var box=$(id);
  box.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b || b.hasAttribute('data-soon')) return;
    var all=box.querySelectorAll('button');
    for(var i=0;i<all.length;i++) all[i].classList.remove('sel');
    b.classList.add('sel');
  });
}
function selVal(id){ var b=$(id).querySelector('button.sel'); return b?b.getAttribute('data-v'):null; }

var S={mode:'normal',stim:'a',total:'x1',totalN:16,queue:[],cur:-1,curs:[],name:'RDS',sport:'',times:[],t0:0,running:false,raf:0,lock:true,countIv:0,coverTo:0,resEnsayos:0,pressed:0,cells:[],sq:[]};

/* ---------- Modo NORMAL (2026-10-08) ----------
   Rejilla de 5x5. Al empezar, 5 cuadrados (al azar) empiezan a ACORTARSE en altura y tardan SQ_START_MS en desaparecer. Se pulsan antes de que
   desaparezcan: el pulsado se RENUEVA (vuelve a su altura) y empiezan a acortarse otros (1 por pulsacion, salvo en los HITOS: cada SQ_MILESTONE_EVERY (10) pulsados desde SQ_TWO_FROM (20),
   en esa pulsacion empiezan 2 (v9: siempre 2, tambien desde el 50); la siguiente vuelve a ser 1). Cada SQ_STEP_EVERY pulsados el tiempo baja SQ_STEP_MS. Un cuadrado que llega abajo sin pulsar queda ANULADO
   (no se renueva, su hueco queda vacio). El ejercicio termina cuando solo quedan SQ_KEEP activos; el resultado es el numero de cuadrados
   pulsados y, de desempate, la reaccion media (cada reaccion = desde que ese cuadrado empezo a acortarse hasta que se pulso).
   DECISIONES MIAS no confirmadas: (1) pulsar un cuadrado activo que NO se esta acortando termina el ejercicio (si no se podria pulsar todo
   sin parar); pulsar un hueco vacio no hace nada; (2) [v10, pedido de Roberto] si ya no queda NINGUNO acortandose (se te escapa el ultimo) el ejercicio
   termina; (3) suelo de SQ_MIN_MS (no indicado); (4) los nuevos nunca incluyen el que acabas de pulsar. */
var SQ_N=16, SQ_COLS=4; /* v16: rejilla 4x4 = 16 cuadrados en TODOS los modos (v15 solo Normal) */
var SQ_FIRST=4;         /* cuadrados que se acortan al empezar (v17: 4, antes 5) */
var SQ_KEEP=5;          /* el ejercicio termina cuando solo quedan 5 activos */
var SQ_START_MS=1500;   /* tiempo que tarda un cuadrado en desaparecer al empezar (v8: 1500 ms; antes 1250, 1000 y 750) */
var SQ_STEP_MS=25;      /* baja 25 ms ... (v4: antes 50) */
var SQ_STEP_EVERY=5;    /* ... cada 5 cuadrados pulsados */
var SQ_MIN_MS=150;      /* suelo del tiempo (provisional, no indicado) */
var SQ_TWO_FROM=20;     /* v6: SOLO al llegar a 20 pulsados empiezan a bajar dos; en la siguiente pulsacion vuelve a ser uno */
var SQ_MILESTONE_EVERY=10;   /* ... y lo mismo en 30, 40, ... (cada 10 desde SQ_TWO_FROM) */

function filterInitials(el){ el.value=el.value.replace(/[^A-Za-z]/g,'').toUpperCase(); }
function startGame(){ try{ var m0=selVal('segModo')||'normal'; warmRank(m0, m0==='limite'?'a':(selVal('segEstimulo')||'a'), m0==='limite'?'0':(selVal('segEnsayos')||'x1')); }catch(e){}
  S.mode=selVal('segModo')||'normal';
  S.stim=(S.mode==='limite') ? 'a' : (selVal('segEstimulo')||'a');   /* v19: a = ELIMINAR (el pulsado queda negro), b = RENOVAR (vuelve a blanco); Limite siempre 'a' */
  S.total=(S.mode==='limite') ? '0' : (selVal('segEnsayos')||'x1');   /* Limite: sin x1/x2/x4 (clave unica '0') */
  S.totalN=(S.mode==='limite')?0:SQ_N*({x1:1,x2:2,x4:4}[S.total]||1);   /* v16: x1 = una vuelta de los 16 cuadrados; x2 y x4 = 2 y 4 vueltas */
  var nm=($('user-ini-input').value||'RDS').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
  S.name=nm||'RDS';
  S.sport=($('user-sport-select')&&$('user-sport-select').value)||'';
  runGame();
}
function repeatGame(){ runGame(); }

function sqDur(){ return Math.max(SQ_MIN_MS, SQ_START_MS - SQ_STEP_MS*Math.floor(S.pressed/SQ_STEP_EVERY)); }
function sqNewCount(){   /* cuantos empiezan a acortarse tras ESTA pulsacion (S.pressed ya incluye la actual) */
  var p=S.pressed;
  if(p>=SQ_TWO_FROM && p%SQ_MILESTONE_EVERY===0){ return 2; }   /* hitos 20, 30, 40, 50, 60...: siempre dos */
  return 1;
}
/* v21: la rejilla cuadrada NO puede depender solo de las unidades cqw/cqh (Chrome 105+): en tablets con WebView antiguo el ancho quedaba invalido
   y la rejilla se colapsaba (todo blanco y un cuadrado negro). Se mide el hueco disponible y se fija el lado en pixeles (el CSS cq queda como respaldo). */
function sqFitGrid(){
  try{ var g=$('grid'), w=g&&g.parentNode; if(!w) return;
    var side=Math.floor(Math.min(w.clientWidth, w.clientHeight))-12;   /* 12 = padding 6+6 de .grid-wrap */
    if(side>40){ g.style.width=side+'px'; g.style.height=side+'px'; }
  }catch(e){}
}
window.addEventListener('resize', sqFitGrid); window.addEventListener('orientationchange', function(){ setTimeout(sqFitGrid,200); });
function sqBuildGrid(){
  var html='', k;
  $('grid').style.gridTemplateColumns='repeat('+SQ_COLS+',1fr)'; $('grid').style.gridTemplateRows='repeat('+SQ_COLS+',1fr)';
  for(k=0;k<SQ_N;k++){ html+='<div class="sq" data-i="'+k+'"><div class="sq-fill"></div></div>'; }
  $('grid').innerHTML=html;
  S.sq=[].slice.call($('grid').querySelectorAll('.sq'));
  S.cells=[]; for(k=0;k<SQ_N;k++){ S.cells.push({st:'full', t0:0, dur:0}); }
  sqFitGrid(); setTimeout(sqFitGrid,0); setTimeout(sqFitGrid,300);
}
function sqActive(){ var n=0,k; for(k=0;k<SQ_N;k++){ if(S.cells[k].st!=='dead') n++; } return n; }
function sqShrinking(){ var n=0,k; for(k=0;k<SQ_N;k++){ if(S.cells[k].st==='shrink') n++; } return n; }
function sqStart(count, exclude){   /* empiezan a acortarse 'count' cuadrados al azar (activos, llenos y distintos de 'exclude') */
  var pool=[], k, now=performance.now(), dur=sqDur(), j, c;
  for(k=0;k<SQ_N;k++){ if(S.cells[k].st==='full' && k!==exclude) pool.push(k); }
  shuffleArr(pool);
  for(j=0;j<count && j<pool.length;j++){ c=S.cells[pool[j]]; c.st='shrink'; c.t0=now; c.dur=dur; S.sq[pool[j]].classList.add('shr'); }
}
function shuffleArr(a){ var i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }

function runGame(){
  if(S.countIv){ clearInterval(S.countIv); S.countIv=0; }
  if(S.coverTo){ clearTimeout(S.coverTo); S.coverTo=0; }
  cancelAnimationFrame(S.raf);
  show('game');
  S.times=[]; S.pressed=0; S.running=false; S.lock=true; S.resEnsayos=0;
  sqBuildGrid();
  $('stTimeK').textContent='Tiempo'; $('stTime').textContent='0:00.00';
  $('stAvgK').textContent='Media react.'; $('stAvg').textContent='--';
  $('trialCount').textContent=(S.mode==='normal'||S.mode==='extremo') ? ('0/'+S.totalN) : '0'; setProgress(0);
  var n=3, el=$('sqCount');
  function step(){
    if(n<=0){ el.textContent=''; beginPlay(); return; }
    el.textContent=String(n); n--; sqFitGrid();
    S.coverTo=setTimeout(step, 800);
  }
  step();
}
function beginPlay(){
  if(S.mode==='normal'){ nrmBegin(); return; }
  if(S.mode==='extremo'){ exBegin(); return; }
  S.coverTo=0; S.lock=false; S.running=true; S.t0=performance.now();
  sqStart(SQ_FIRST, -1);
  S.raf=requestAnimationFrame(sqLoop);
}
function sqLoop(){
  if(!S.running) return;
  var now=performance.now(), k, c, f, annulled=false;
  $('stTime').textContent=fmtTime(now-S.t0);
  for(k=0;k<SQ_N;k++){
    c=S.cells[k];
    if(c.st==='shrink'){
      f=1-(now-c.t0)/c.dur;
      if(f<=0){ c.st='dead'; S.sq[k].classList.add('dead'); annulled=true; }
      else { S.sq[k].firstChild.style.height=(f*100).toFixed(1)+'%'; }
    }
  }
  if(annulled){
    var act=sqActive();
    setProgress((SQ_N-act)/(SQ_N-SQ_KEEP));
    if(act<=SQ_KEEP){ finish('fin'); return; }
    if(sqShrinking()===0){ finish('last'); return; }   /* v10: se escapo el unico que se acortaba: ejercicio terminado (perdido) */
  }
  S.raf=requestAnimationFrame(sqLoop);
}
function onPick(cell){
  if(!S.running || S.lock) return;
  if(S.mode==='normal'){ nrmPick(cell); return; }
  if(S.mode==='extremo'){ exPick(cell); return; }
  var i=parseInt(cell.getAttribute('data-i'),10), c=S.cells[i];
  if(!c || c.st==='dead') return;                      /* hueco vacio: no hace nada */
  if(c.st==='full'){ sndFail(); finish('wrong'); return; }   /* no se estaba acortando */
  var rt=performance.now()-c.t0;
  S.times.push(rt); S.pressed++;
  sndSymbol();
  c.st='full'; c.t0=0; c.dur=0; S.sq[i].classList.remove('shr'); S.sq[i].firstChild.style.height='100%';   /* se renueva */
  $('trialCount').textContent=String(S.pressed);
  updateStats();
  sqStart(sqNewCount(), i);
}

/* ---------- Modo NORMAL (2026-10-08) ----------
   Los cuadrados bajan DE UNO EN UNO: uno se pone en rojo y empieza a acortarse (SQN_MS = 1000 ms en llegar abajo); al pulsarlo se ELIMINA (hueco vacio)
   y empieza otro, hasta completar los 16. En x2 al acabar los 16 TODOS se renuevan (vuelven a aparecer) y se repite; en x4, cuatro vueltas.
   Resultado = reaccion media (desde que el cuadrado empieza a acortarse hasta que se pulsa). El orden es al azar en cada vuelta.
   DECISIONES MIAS: si el cuadrado llega abajo sin pulsarlo, o se pulsa uno que no es el activo, el ejercicio se da por FALLADO (pantalla Fallo, no se guarda). */
var SQN_MS=1000;
function nrmCycle(){   /* todos los cuadrados (re)aparecen y se ordenan al azar */
  var k;
  for(k=0;k<SQ_N;k++){ S.cells[k]={st:'full', t0:0, dur:0}; S.sq[k].classList.remove('dead','shr'); S.sq[k].firstChild.style.height='100%'; }
  S.queue=[]; for(k=0;k<SQ_N;k++){ S.queue.push(k); } shuffleArr(S.queue);
}
function nrmNext(){
  var i, c, pool, k;
  if(S.stim==='b'){ pool=[]; for(k=0;k<SQ_N;k++){ if(k!==S.cur) pool.push(k); } i=pool[Math.floor(Math.random()*pool.length)]; }   /* RENOVAR: al azar entre los 16, salvo el recien pulsado */
  else { i=S.queue.shift(); }
  c=S.cells[i];
  c.st='shrink'; c.t0=performance.now(); c.dur=SQN_MS; S.sq[i].classList.add('shr'); S.cur=i;
}
function nrmBegin(){
  S.cur=-1; S.coverTo=0; S.lock=false; S.running=true; S.t0=performance.now();
  nrmCycle(); nrmNext();
  S.raf=requestAnimationFrame(nrmLoop);
}
function nrmLoop(){
  if(!S.running) return;
  var now=performance.now(), c=S.cells[S.cur], f;
  $('stTime').textContent=fmtTime(now-S.t0);
  f=1-(now-c.t0)/c.dur;
  if(f<=0){ S.sq[S.cur].firstChild.style.height='0%'; failNormal('Se te ha escapado un cuadrado. Vuelve a intentarlo.'); return; }
  S.sq[S.cur].firstChild.style.height=(f*100).toFixed(1)+'%';
  S.raf=requestAnimationFrame(nrmLoop);
}
function nrmPick(cell){
  var i=parseInt(cell.getAttribute('data-i'),10), c=S.cells[i];
  if(!c || c.st==='dead') return;                       /* hueco vacio: no hace nada */
  if(i!==S.cur){ failNormal('Has pulsado un cuadrado que no era el que se acortaba. Vuelve a intentarlo.'); return; }
  var rt=performance.now()-c.t0;
  S.times.push(rt); S.pressed++;
  sndSymbol();
  if(S.stim==='b'){ c.st='full'; c.t0=0; c.dur=0; S.sq[i].classList.remove('shr'); S.sq[i].firstChild.style.height='100%'; }   /* RENOVAR: vuelve a blanco */
  else { c.st='dead'; S.sq[i].classList.remove('shr'); S.sq[i].classList.add('dead'); }   /* ELIMINAR: el pulsado queda negro */
  $('trialCount').textContent=S.pressed+'/'+S.totalN; setProgress(S.pressed/S.totalN);
  updateStats();
  if(S.pressed>=S.totalN){ finishNormal(); return; }
  if(S.stim!=='b' && !S.queue.length){ nrmCycle(); }    /* ELIMINAR: acabaron los 16: vuelven a aparecer todos */
  nrmNext();
}
/* ---------- Modo EXTREMO (2026-10-08) ----------
   Igual que NORMAL, pero salen TRES cuadrados a la vez (v18; antes DOS) (los dos empiezan a acortarse en el mismo instante, SQE_MS = 1000 ms hasta llegar abajo).
   Hay que pulsar los dos: si cualquiera de los dos llega abajo sin pulsarse, o se pulsa un cuadrado que no se esta acortando, el ejercicio se da
   por FALLADO. No salen otros dos hasta haber pulsado AMBOS. Cada pulsacion cuenta como un acierto (x1/x2/x4 = 16/32/64 cuadrados pulsados, como en Normal);
   la reaccion de cada cuadrado va desde que empezo a acortarse hasta que se pulsa. Los 16 cuadrados se reparten de tres en tres (v18): 5 rondas de 3 y una ultima de UN solo cuadrado por vuelta (16 no es multiplo de 3; decision mia);
   en x2 y x4 las vueltas se renuevan como en Normal.
   Se guarda en su propio ranking (mode='extremo'), ordenado por reaccion media. */
var SQE_MS=1000, SQE_N=3;   /* v18: 3 cuadrados a la vez (antes 2) */
function exNext(){
  var need=Math.min(SQE_N, S.totalN-S.pressed), k, i, c;
  var pool=[];
  if(S.stim==='b'){ for(k=0;k<SQ_N;k++){ if((S.last||[]).indexOf(k)<0) pool.push(k); } shuffleArr(pool); }   /* RENOVAR: al azar, sin repetir los de la ronda anterior */
  else if(!S.queue.length){ nrmCycle(); }
  S.curs=[];
  for(k=0;k<need && (S.stim==='b' ? pool.length : S.queue.length);k++){
    i=(S.stim==='b') ? pool.shift() : S.queue.shift(); c=S.cells[i];
    c.st='shrink'; c.t0=performance.now(); c.dur=SQE_MS; S.sq[i].classList.add('shr'); S.curs.push(i);
  }
  S.last=S.curs.slice();
}
function exBegin(){
  S.last=[]; S.coverTo=0; S.lock=false; S.running=true; S.t0=performance.now();
  nrmCycle(); exNext();
  S.raf=requestAnimationFrame(exLoop);
}
function exLoop(){
  if(!S.running) return;
  var now=performance.now(), k, i, c, f;
  $('stTime').textContent=fmtTime(now-S.t0);
  for(k=0;k<S.curs.length;k++){
    i=S.curs[k]; c=S.cells[i];
    f=1-(now-c.t0)/c.dur;
    if(f<=0){ S.sq[i].firstChild.style.height='0%'; failNormal('Se te ha escapado un cuadrado. Vuelve a intentarlo.'); return; }
    S.sq[i].firstChild.style.height=(f*100).toFixed(1)+'%';
  }
  S.raf=requestAnimationFrame(exLoop);
}
function exPick(cell){
  var i=parseInt(cell.getAttribute('data-i'),10), c=S.cells[i], pos=S.curs.indexOf(i);
  if(!c || c.st==='dead') return;                       /* hueco vacio: no hace nada */
  if(pos<0){ failNormal('Has pulsado un cuadrado que no era de los que se acortaban. Vuelve a intentarlo.'); return; }
  var rt=performance.now()-c.t0;
  S.times.push(rt); S.pressed++;
  sndSymbol();
  if(S.stim==='b'){ c.st='full'; c.t0=0; c.dur=0; S.sq[i].classList.remove('shr'); S.sq[i].firstChild.style.height='100%'; }   /* RENOVAR: vuelve a blanco */
  else { c.st='dead'; S.sq[i].classList.remove('shr'); S.sq[i].classList.add('dead'); }
  S.curs.splice(pos,1);
  $('trialCount').textContent=S.pressed+'/'+S.totalN; setProgress(S.pressed/S.totalN);
  updateStats();
  if(S.pressed>=S.totalN){ finishNormal(); return; }
  if(S.curs.length===0){ exNext(); }                    /* hasta pulsar los TRES no salen los siguientes */
}
function failNormal(msg){
  S.running=false; S.lock=true; cancelAnimationFrame(S.raf);
  if(S.coverTo){ clearTimeout(S.coverTo); S.coverTo=0; }
  S.saved=null; sndFail();
  var fm=$('failMsg'); if(fm){ fm.textContent=msg; }
  show('fail');
}
function finishNormal(){
  S.running=false; S.lock=true; cancelAnimationFrame(S.raf);
  var total=performance.now()-S.t0, c=calc();
  $('rK1').textContent='Media de reacci\u00f3n'; $('rK2').textContent='por acierto'; $('rK3').textContent='Mejor (ms)'; $('rK4').textContent='Peor (ms)';
  $('resMsg').style.display='none'; $('resEns').style.display='none';
  $('rAvg').textContent=Math.round(c.avg)+' ms';
  $('rTime').textContent=fmtTime(total);
  $('rBest').textContent=String(Math.round(c.best));
  $('rWorst').textContent=String(Math.round(c.worst));
  S.resAvg=c.avg; S.resTotal=total; S.resEnsayos=S.pressed; S.saved=false;
  renderChart(S.times);
  var gb=$('btnGuardar'); if(gb){ gb.disabled=false; gb.textContent='Guardar resultado'; }
  showSaveScreen();
}

function setProgress(frac){ $('prog').style.width=(Math.max(0,Math.min(1,frac))*100)+'%'; }

function calc(){
  var n=S.times.length, sum=0, best=Infinity, worst=0;
  for(var i=0;i<n;i++){ sum+=S.times[i]; if(S.times[i]<best) best=S.times[i]; if(S.times[i]>worst) worst=S.times[i]; }
  return {n:n, sum:sum, avg:n?sum/n:0, best:best===Infinity?0:best, worst:worst};
}
function updateStats(){
  var c=calc();
  $('stAvg').textContent = c.n===0 ? '--' : String(Math.round(c.avg));
}

function renderChart(times){
  var box=$('resChart'); if(!box) return;
  var n=times.length; if(n===0){ box.innerHTML=''; return; }
  var W=320,H=132,padL=12,padR=12,padT=12,padB=22;
  var min=Math.min.apply(null,times), max=Math.max.apply(null,times), span=(max-min)||1;
  var pw=W-padL-padR, ph=H-padT-padB, base=padT+ph, i;
  function X(i){ return n===1?padL+pw/2:padL+(i/(n-1))*pw; }
  function Y(v){ return padT+(1-(v-min)/span)*ph; }
  var pts=[]; for(i=0;i<n;i++){ pts.push([X(i),Y(times[i])]); }
  var area='M '+pts[0][0].toFixed(1)+' '+base.toFixed(1);
  for(i=0;i<n;i++){ area+=' L '+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1); }
  area+=' L '+pts[n-1][0].toFixed(1)+' '+base.toFixed(1)+' Z';
  var poly=''; for(i=0;i<n;i++){ poly+=(i?' ':'')+pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1); }
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<path d="'+area+'" fill="rgba(162,58,41,0.10)" stroke="none"/>';
  s+='<polyline points="'+poly+'" fill="none" stroke="#A23A29" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var step=n<=12?1:5;
  for(i=0;i<n;i++){
    if(i===0||i===n-1||((i+1)%step)===0){
      s+='<text x="'+pts[i][0].toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-family="Arial" font-size="9" fill="#9A9A9A">'+(i+1)+'</text>';
    }
  }
  box.innerHTML=s+'</svg>';
}

/* Posicion de este resultado (2026-10-05): se calcula con la copia local del ranking (cache de esta combinacion + marcas
   pendientes de este dispositivo), sin ninguna lectura de Firestore. Cuenta solo la mejor marca de cada OTRA persona, igual que
   el ranking (que oculta repetidos). Sin copia guardada de la combinacion no se muestra nada. */
function updatePos(){
  var w=document.getElementById('posWrap'); if(!w) return;
  w.style.display='none';
  try{
    if(S.libre||!isFinite(S.resAvg)) return;
    
    var g=loadRankCache(rankCacheKey(S.mode,S.stim,S.total)); if(!g) return;
    var nm=(S.sport?(S.name+'-'+S.sport):S.name), rec={ name:nm, avg:Math.round(S.resAvg), ensayos:S.resEnsayos, ts:Date.now() };
    
    var rows=mergeRank(g,pendingOnly(loadLb(lbKey(S.mode,S.stim,S.total))));
    sortLb(rows,S.mode);
    var seen={}, out=[];
    rows.forEach(function(r){ var n=r.name||''; if(n===rec.name||seen[n]) return; seen[n]=1; out.push(r); });
    out.push(rec);
    sortLb(out,S.mode);
    var p=out.indexOf(rec)+1, e=document.getElementById('posNum');
    e.textContent=p; e.style.fontSize=p>=100?'16px':(p>=10?'22px':'26px');
    w.style.display='flex';
  }catch(e){}
}
function showSaveScreen(){ updatePos();
  var ov=document.getElementById('transition-overlay');
  if(ov){
    ov.className='active';
    setTimeout(function(){
      ov.className='';
      show('result');
    }, 1000);
  } else {
    setTimeout(function(){ show('result'); }, 800);
  }
}

function finish(reason){
  S.running=false; S.lock=true; cancelAnimationFrame(S.raf);
  if(S.coverTo){ clearTimeout(S.coverTo); S.coverTo=0; }
  var total=performance.now()-S.t0, c=calc();
  $('resMsg').textContent = (reason==='wrong') ? 'Has pulsado un cuadrado que no se estaba acortando' : (reason==='last' ? 'Se te ha escapado el último cuadrado que se estaba acortando' : 'Fin del ejercicio: solo quedan '+SQ_KEEP+' cuadrados');
  $('rK1').textContent='Cuadrados'; $('rK2').textContent='pulsados'; $('rK3').textContent='Media (ms)'; $('rK4').textContent='Mejor (ms)';
  $('resMsg').style.display='block'; $('resEns').style.display='none';
  $('rAvg').textContent=String(S.pressed);
  $('rTime').textContent=fmtTime(total);
  $('rBest').textContent=c.n?String(Math.round(c.avg)):'--';
  $('rWorst').textContent=c.n?String(Math.round(c.best)):'--';
  S.resAvg=c.avg; S.resTotal=total; S.resEnsayos=S.pressed; S.saved=(S.pressed>0)?false:null;   /* sin ningun cuadrado pulsado no hay nada que guardar */
  renderChart(S.times);
  var gb=$('btnGuardar'); if(gb){ gb.disabled=(S.pressed===0); gb.textContent='Guardar resultado'; }
  showSaveScreen();
}

function lbKey(mode,stim,total){ return 'rds_sqr_'+mode+'_'+stim+'_'+total; }
function loadLb(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
function rankCacheKey(mode,stim,total){ return 'rds_sqr_rankcache_'+mode+'_'+stim+'_'+total; }
function loadRankCache(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function saveRankCache(k,rows){ try{ localStorage.setItem(k, JSON.stringify(rows)); localStorage.setItem(k+'_ts', String(Date.now())); }catch(e){} }
function sortLb(lb,mode){   /* Limite: mas cuadrados pulsados primero, desempate por reaccion media; Normal: reaccion media */
  if(mode==='limite'){ lb.sort(function(a,b){ return ((b.ensayos||0)-(a.ensayos||0))||(a.avg-b.avg); }); }
  else { lb.sort(function(a,b){ return a.avg-b.avg; }); }
}
function saveScore(avg,total){
  var nm = S.sport ? (S.name+'-'+S.sport) : S.name;
  var rec={ mode:S.mode, stim:S.stim, total:S.total, name:nm, ensayos:S.resEnsayos, avg:Math.round(avg), tt:Math.round(total), ts:Date.now() };
  var k=lbKey(S.mode,S.stim,S.total), lb=loadLb(k);
  lb.push(rec); sortLb(lb,S.mode); lb=lb.slice(0,50);
  try{ localStorage.setItem(k,JSON.stringify(lb)); }catch(e){}
  S.lastRec=rec; S.lastRecKey=k;
  if(window.fbSave){ window.fbSave(rec); }
}

function setSeg(id,val){
  var bs=$(id).querySelectorAll('button'),i;
  for(i=0;i<bs.length;i++){ bs[i].classList.toggle('sel', bs[i].getAttribute('data-v')===String(val)); }
}
var hideRepeated=true;
/* periodo del ranking: s = ultimos 7 dias, m = ultimos 30, t = todo (por defecto). Marca sin fecha: solo cuenta en Todo. */
var rankPer='t';
function setRankPer(p){
  rankPer=p;
  var bs=document.querySelectorAll('#per-tog button'),i;
  for(i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-p')===p); }
  rankFromSel();
}
function filterPeriod(list){
  if(rankPer==='t') return list;
  var lim=Date.now()-(rankPer==='s'?7:30)*86400000;
  return list.filter(function(d){ var t=(typeof d.ts==='number')?d.ts:(typeof d.date==='number'?d.date:null); if(t==null && typeof d.date==='string'){ var m=d.date.match(/^(\d+)\/(\d+)\/(\d+)$/); if(m) t=new Date(+m[3],+m[2]-1,+m[1]).getTime(); } return t!=null && t>=lim; });
}

function toggleHideRepeated(){
  hideRepeated=!hideRepeated;
  var btn=document.getElementById('btn-hide-repeated');
  if(btn) btn.textContent=hideRepeated?'Mostrar repetidos':'Ocultar repetidos';
  rankFromSel();
}

function filterRepeated(list){
  var max=hideRepeated?1:3;
  var seen={}, result=[];
  for(var i=0;i<list.length;i++){
    var name=(list[i].name||'').toLowerCase().trim();
    var c=seen[name]||0;
    if(c<max){ seen[name]=c+1; result.push(list[i]); }
  }
  return result;
}

function getHomeName(){
  var iniEl=document.getElementById('user-ini-input');
  var sptEl=document.getElementById('user-sport-select');
  if(!iniEl||!sptEl) return '';
  var nm=((iniEl.value||'RDS').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3))||'RDS';
  var sport=(sptEl.value||'').trim().toUpperCase();
  return sport ? (nm+'-'+sport) : nm;
}

function renderRankList(list, el, m, latest){
  list=filterRepeated(filterPeriod(list));
  function rankBetter(a,b){
    if(a==null) return false; if(b==null) return true;
    var av=(a.avg==null?9999:a.avg), bv=(b.avg==null?9999:b.avg);
    if(m==='limite'){
      var ae=(a.ensayos||0), be=(b.ensayos||0);
      return ae>be || (ae===be && av<bv);
    }
    return av<bv;
  }
  var medals=['gold','silver','bronze'];
  var meName=getHomeName();
  var myIdx=-1, myEntry=null;
  if(meName){
    for(var k=0;k<list.length;k++){
      if((list[k].name||'').trim().toUpperCase()===meName){ myIdx=k; myEntry=list[k]; break; }
    }
  }
  el.innerHTML='';
  var display=list.slice(0,15);
  if(!display.length){
    var d=document.createElement('div');d.className='rank-full-empty';
    d.textContent='Sin resultados';el.appendChild(d);return;
  }
  function buildRow(entry, posLabel, medalIdx, isMe, grey){
    var row=document.createElement('div');row.className='rank-full-row'+(isMe?' rank-full-me':'')+(isMe&&grey?' me-grey':'');
    var pos=document.createElement('div');
    pos.className='rank-full-pos'+(medalIdx>=0 && medalIdx<3?' '+medals[medalIdx]:'');
    pos.textContent=posLabel;
    var nm=document.createElement('div');nm.className='rank-full-name';nm.textContent=entry.name;
    var ms=document.createElement('div');ms.className='rank-full-ms';
    ms.textContent=(m==='limite') ? ((entry.ensayos||0)+'/'+entry.avg) : (entry.avg+' ms');
    var dt=document.createElement('div');dt.className='rank-full-date';dt.textContent=entry.ts?fmtDate(entry.ts):'';
    row.appendChild(pos);row.appendChild(nm);row.appendChild(ms);row.appendChild(dt);
    return row;
  }
  for(var i=0;i<display.length;i++){
    var rowName=(display[i].name||'').trim().toUpperCase();
    var isMe=meName && rowName===meName;
    el.appendChild(buildRow(display[i], (i+1), i, isMe));
  }
  if(myEntry && myIdx>=15){
    var posLabel=(myIdx+1>=100)?'100+':String(myIdx+1);
    el.appendChild(buildRow(myEntry, posLabel, -1, true));
  }
  if(latest){
    var shownTs={};
    for(var s2=0;s2<display.length;s2++){ if(display[s2].ts!=null) shownTs[display[s2].ts]=1; }
    var bestExtra=(myEntry && myIdx>=15 && myEntry.ts===latest.ts);
    if(!shownTs[latest.ts] && !bestExtra){
      var lpos=1;
      for(var q=0;q<list.length;q++){ if(rankBetter(list[q], latest)) lpos++; }
      var greyLatest=!!(myEntry && myIdx<15 && rankBetter(myEntry, latest));
      el.appendChild(buildRow(latest, (lpos>=100?'100+':String(lpos)), -1, true, greyLatest));
    }
  }
}

function rankFromSel(){
  var mode=selVal('segModoR')||'normal';
  var lim=(mode==='limite');
  var stim=lim ? 'a' : (selVal('segEstR')||'a');   /* Limite: sin x1/x2/x4 (clave unica '0'), ese selector queda anulado */
  $('segEnsR').classList.toggle('off', lim); $('segEstR').classList.toggle('off', lim);
  renderRank(mode,stim,lim ? '0' : (selVal('segEnsR')||'x1'));
}

function showRanking(){
  hideRepeated=true; rankPer='t'; (function(){ var bs=document.querySelectorAll('#per-tog button'),i; for(i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-p')==='t'); } })();

function capName(rows,max){
  var seen={}, out=[], i, nm;
  for(i=0;i<rows.length;i++){
    nm=rows[i].name||'';
    seen[nm]=(seen[nm]||0)+1;
    if(seen[nm]<=max){ out.push(rows[i]); }
  }
  return out;
}
/* Ranking (2026-09-30): lo que se ve es SIEMPRE la union de (a) el ranking
   global -- en directo si hay red (onSnapshot: si otro deportista sube al
   primer puesto se ve al momento, sin salir y volver a entrar), o la ultima
   copia guardada si no la hay -- y (b) las marcas de ESTE dispositivo
   (lbLocal, incluidas las aun pendientes de subir). Asi, sin conexion, se
   ve donde queda tu marca dentro del ranking que ya conocias; al volver
   la red, la cola de pendientes las sube y el global las incluye (se
   deduplican por nombre+fecha+marca). */
var rankUnsub=null;
function stopRankWatch(){ if(rankUnsub){ try{ rankUnsub(); }catch(e){} rankUnsub=null; } }
/* 2026-10-01: de lo local solo se muestran las marcas PENDIENTES de subir (la cola
   rds_sqr_pending), NO todo el historial de este dispositivo. Antes se sumaba todo lo
   guardado en local y, si alguna marca nunca llego a Firestore, solo este aparato
   la veia y los rankings de distintos aparatos no coincidian. Las marcas ya
   subidas llegan por el ranking global; las pendientes se ven aqui hasta que suban. */
function pendingOnly(list){
  var set={};
  try{ JSON.parse(localStorage.getItem('rds_sqr_pending')||'[]').forEach(function(q){ var r=(q && q.entry) ? q.entry : q; if(r) set[(r.name||'')+'|'+(r.ts||r.date||'')]=1; }); }catch(e){}
  return (list||[]).filter(function(r){ return set[(r.name||'')+'|'+(r.ts||r.date||'')]; });
}
function mergeRank(globalRows,localRows){
  var out=[], seen={};
  (globalRows||[]).concat(localRows||[]).forEach(function(r){
    var k=(r.name||'')+'|'+r.ts+'|'+r.avg+'|'+(r.ensayos||'');
    if(!seen[k]){ seen[k]=1; out.push(r); }
  });
  return out;
}
function renderRank(mode,stim,total){
  var key=lbKey(mode,stim,total); S.rankKey=key;
  var el=$('rkList'); if(!el) return;
  stopRankWatch();
  var latest=null;
  if(S.saved===false && isFinite(S.resAvg) && lbKey(S.mode,S.stim,S.total)===key){
    latest={ name:(S.sport?(S.name+'-'+S.sport):S.name), avg:Math.round(S.resAvg), ensayos:S.resEnsayos, ts:Date.now() };
  } else if(S.lastRec && S.lastRecKey===key){
    latest=S.lastRec;
  }
  var lbLocal=pendingOnly(loadLb(key));
  var rcKey=rankCacheKey(mode,stim,total);
  function draw(globalRows){
    var rows=mergeRank(globalRows,lbLocal);
    sortLb(rows, mode);
    renderRankList(rows, el, mode, latest);
  }
  draw(loadRankCache(rcKey)||[]);
  if(window.fbWatch){
    rankUnsub=window.fbWatch(mode,stim,total,function(rows){
      if(S.rankKey!==key) return;
      saveRankCache(rcKey, rows);
      draw(rows);
    });
  }
}
/* Precarga (2026-09-30): al empezar un ejercicio con red, se guarda el
   ranking de ESA combinacion (1 consulta, como mucho cada 30 min) para que
   si luego se juega sin conexion ya este disponible. */
function warmRank(mode,stim,total){
  if(!window.fbLoad || !navigator.onLine) return;
  var rcKey=rankCacheKey(mode,stim,total), t=0;
  try{ t=+localStorage.getItem(rcKey+'_ts')||0; }catch(e){}
  if(Date.now()-t < 30*60*1000) return;
  window.fbLoad(mode,stim,total).then(function(rows){ if(rows){ saveRankCache(rcKey, rows); } }).catch(function(){});
}

<script>
/* Identidad pasada desde SuiteRDS (2026-09-28): si se entra desde el boton
   de Rankings de SuiteRDS, la URL lleva ?ini=XXX&dep=YYY con lo que la
   persona ya marco alli como "quien soy". Se rellenan los mismos campos
   de siempre (INI + deporte) y se disparan sus propios eventos input/
   change -- así cada app usa TAL CUAL su mecanismo ya existente de
   recordar nombre y de resaltar "tu" fila en el ranking, sin duplicar esa
   logica aqui. Sin parametros en la URL, no hace nada (uso normal). */
(function(){
  /* 2026-10-01: se aplica al TERMINAR de cargar la pagina (evento load), no al parsear este script:
     varias apps restauran despues su INI/deporte guardados en este aparato y pisaban lo que manda
     SuiteRDS (Ball Coordination y Tenis dejaban siempre el deporte en OTR). */
  function applyUrlIdentity(){
  try{
    var params=new URLSearchParams(location.search);
    var ini=params.get('ini'), dep=params.get('dep');
    if(!ini && !dep) return;
    var iniEl=document.getElementById('user-ini-input')||document.getElementById('home-initials');
    var sptEl=document.getElementById('user-sport-select')||document.getElementById('home-sport');
    if(ini && iniEl){
      iniEl.value=ini.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
      iniEl.dispatchEvent(new Event('input',{bubbles:true}));
    }
    if(dep && sptEl){
      sptEl.value=dep;
      sptEl.dispatchEvent(new Event('change',{bubbles:true}));
    }
  }catch(e){}
  }
  if(document.readyState==='complete') applyUrlIdentity(); else window.addEventListener('load', applyUrlIdentity);
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBbEgbWddPt_rhPM24bL_Nacp7TAlh1biM",
  authDomain: "rds-reaction-test.firebaseapp.com",
  projectId: "rds-reaction-test",
  storageBucket: "rds-reaction-test.firebasestorage.app",
  messagingSenderId: "490684952529",
  appId: "1:490684952529:web:bb53a9813bd58ecdb3baf0"
};
/* Sin persistencia offline (2026-09-28): initializeFirestore con
   persistentLocalCache+persistentMultipleTabManager puede quedarse
   esperando un candado entre pestanas/sesiones que nunca se libera --
   reportado por el usuario: el ranking se quedaba mostrando solo lo local
   de este dispositivo, y NO se arreglaba ni cerrando y reabriendo la app
   (el candado vive en IndexedDB, no en memoria). El guardado local
   (localStorage, ver saveScore()) sigue funcionando igual sin conexion;
   lo unico que se pierde es la cola de reintento automatico de Firestore
   cuando no hay red -- si falla el guardado en la nube, se queda solo en
   local hasta que se vuelva a intentar desde esta app. Mismo fix ya
   aplicado hoy en SuiteRDS por el mismo motivo. */
let db=null;
try{
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app);
}catch(e){ db=null; }
window.fbReady=!!db;

/* Cola de reintento offline (2026-09-28, propia, en localStorage):
   ya no hay persistencia de Firestore (ver nota arriba), asi que si
   fbSave falla o no hay red, la marca se guarda aqui y se reintenta
   sola al recuperar conexion (evento 'online' + al volver a primer
   plano). No usa IndexedDB ni el motor offline de Firestore -> no
   puede reproducir el candado entre pestanas del Paso H. */
var PENDING_KEY='rds_sqr_pending';
function loadPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } }
function savePending(arr){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(arr)); }catch(e){} }
function updatePendingUI(){
  var n=loadPending().length, el=document.getElementById('pending-sync');
  if(!el) return;
  if(n>0){ el.style.display='block'; el.textContent='⚠ '+n+(n===1?' marca pendiente de subir':' marcas pendientes de subir'); }
  else{ el.style.display='none'; el.textContent=''; }
}
function withTimeout(p,ms){
  return new Promise(function(resolve,reject){
    var done=false, t=setTimeout(function(){ if(!done){ done=true; reject(new Error('timeout')); } }, ms);
    p.then(function(v){ if(!done){ done=true; clearTimeout(t); resolve(v); } }, function(e){ if(!done){ done=true; clearTimeout(t); reject(e); } });
  });
}
var flushing=false;
async function flushPending(){
  if(!db || flushing || !navigator.onLine) return;
  var pend=loadPending();
  if(!pend.length) return;
  flushing=true;
  var rest=[];
  for(var i=0;i<pend.length;i++){
    try{ await withTimeout(addDoc(collection(db,'scores_squares'), pend[i]), 8000); }
    catch(e){ rest.push(pend[i]); }
  }
  savePending(rest);
  updatePendingUI();
  flushing=false;
}
/* Red de seguridad (2026-10-01): garantiza que NINGUNA marca guardada en este dispositivo
   se quede sin llegar al ranking global. Cada marca se guarda siempre en local; si por lo
   que sea (fallo de envio con la app cerrada, SDK sin cargar offline, version antigua sin
   cola...) no llego a subir ni esta en la cola, esta pasada la encuentra y la encola.
   Al abrir la app con red (y al recuperarla), como mucho cada 6 h: se comprueban las marcas
   locales aun no verificadas contra Firestore (1 consulta por nombre, solo lectura) y las
   que faltan se anaden a la cola de pendientes (que ya sabe subirlas). Si cualquier
   comprobacion falla NO se sube nada (evita duplicados). Las verificadas se recuerdan para
   no repetir lecturas. */
var RECON_PFX='rds_sqr_', RECON_COL='scores_squares';
function reconKey(r){ return (r.name||'')+'|'+(r.ts||r.date||''); }
function reconOk(r){ return r && r.name && typeof r.ts==='number' && r.mode!==undefined && r.stim!==undefined && r.total!==undefined; }
function reconCollect(){
  var out=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k || k.indexOf(RECON_PFX)!==0 || /rankcache|pending|recon|legacy|_ts$/.test(k)) continue;
      var arr; try{ arr=JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
      if(!Array.isArray(arr)) continue;
      arr.forEach(function(r){ if(reconOk(r)) out.push(r); });
    }
  }catch(e){}
  return out;
}
async function reconcileOrphans(force, dry){
  try{
    if(!db || !navigator.onLine) return null;
    var now=Date.now(), TS=RECON_PFX+'recon_ts', OK=RECON_PFX+'recon_ok';
    if(!force && now-(+localStorage.getItem(TS)||0) < 6*3600*1000) return null;
    var ok={}; try{ ok=JSON.parse(localStorage.getItem(OK)||'{}')||{}; }catch(e){ ok={}; }
    var pend={}; loadPending().forEach(function(q){ pend[reconKey(q)]=1; });
    var seen={}, cands=[];
    reconCollect().forEach(function(r){
      var k=reconKey(r); if(seen[k] || ok[k] || pend[k]) return; seen[k]=1;
      if(now-(r.ts||r.date||0) < 120000) return;   // recien guardada: puede estar subiendose ahora mismo
      cands.push(r);
    });
    if(!cands.length){ if(!dry) localStorage.setItem(TS,String(now)); return {cands:0, add:[]}; }
    var names={}; cands.forEach(function(r){ names[r.name]=1; });
    var have={};
    for(var nm in names){
      var snap=await withTimeout(getDocs(query(collection(db,RECON_COL), where('name','==',nm))), 12000);   // si falla, lanza: no se sube nada
      snap.forEach(function(d){ have[reconKey(d.data())]=1; });
    }
    var add=[];
    cands.forEach(function(r){ var k=reconKey(r); if(have[k]) ok[k]=1; else add.push(r); });
    if(dry) return {cands:cands.length, add:add};
    add.forEach(function(r){ ok[reconKey(r)]=1; });   // quedan en la cola: no volver a consultarlas
    var ks=Object.keys(ok); if(ks.length>3000){ var n2={}; ks.slice(ks.length-3000).forEach(function(k){ n2[k]=1; }); ok=n2; }
    if(add.length){ savePending(loadPending().concat(add)); updatePendingUI(); }
    localStorage.setItem(OK,JSON.stringify(ok)); localStorage.setItem(TS,String(now));
    if(add.length) flushPending();
    return {cands:cands.length, add:add};
  }catch(e){ return null; }
}
window.fbReconcile=function(dry){ return reconcileOrphans(true, !!dry); };
setTimeout(reconcileOrphans, 8000);
window.addEventListener('online', function(){ setTimeout(reconcileOrphans, 4000); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ setTimeout(reconcileOrphans, 4000); } });
window.fbSave=async function(rec){
  if(!db) return false;
  if(!navigator.onLine){ var p1=loadPending(); p1.push(rec); savePending(p1); updatePendingUI(); return false; }
  try{ await withTimeout(addDoc(collection(db,'scores_squares'), rec), 8000); return true; }
  catch(e){ var p2=loadPending(); p2.push(rec); savePending(p2); updatePendingUI(); return false; }
};
window.addEventListener('online', flushPending);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ flushPending(); } });
updatePendingUI();
flushPending();
/* ===== Ranking INCREMENTAL (2-oct-2026): ahorra lecturas de Firestore =====
   Cada dispositivo guarda la coleccion que ya conoce (localStorage) y solo pide lo nuevo: lectura completa la
   primera vez (y cada 7 dias, por si se borro algo a mano); despues solo ts >= ultimo-6h, con escucha en directo
   solo sobre esos documentos nuevos. Las marcas de otros siguen apareciendo al instante; el guardado no cambia. */
/* v+ (2026-10-12): SEMILLA ESTATICA. Un proceso de GitHub (repo rds-rankings-data) publica en GitHub Pages el JSON completo de cada ranking (cada ~15 min). En vez de
   la lectura completa de Firestore (miles de lecturas por dispositivo) se descarga ese JSON (gratis) y, a partir de su ultima marca, solo se piden a Firestore las
   nuevas (margen 1 h) + escucha en directo. Si el JSON falla y hay copia local no se gastan lecturas completas (reintento en 30 min); sin copia, lectura completa de siempre. */
var STATIC_BASE=(location.hostname==='localhost'||location.hostname==='127.0.0.1') ? '/rds-rankings-data/data/' : 'https://rdsk27.github.io/rds-rankings-data/data/';
var STATIC_COLS=['scores_ballcoordination','scores_circuit','scores_gimnasia','scores_lights','scores_memorycards','scores_perception','scores_processing','scores_processing2','scores_rallymemory','scores_reactionkarate','scores_reactiontenis','scores_reactiontrial','scores_squares','scores_reaction_10_normal_press_nosound','scores_reaction_10_normal_press_sound'];
function mkInc(COL,TSF,KEY,STRIP){
  var HAS_JSON=STATIC_COLS.indexOf(COL)>=0, WEEK=7*864e5, AGE=HAS_JSON?12*36e5:WEEK, MARGIN=(HAS_JSON?1:6)*36e5, c={docs:{},full:0,ts:0}, loaded=false;
  function load(){ if(loaded) return; loaded=true; try{ var o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o&&o.docs&&typeof o.docs==='object') c=o; }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){} }
  function strip(r){ if(STRIP&&r&&r[STRIP]!==undefined) delete r[STRIP]; return r; }
  function put(id,r){ c.docs[id]=r; var t=r&&r[TSF]; if(typeof t==='number'&&t>c.ts&&t<=Date.now()+36e5) c.ts=t; }
  function rows(f){ var out=[],id,r; for(id in c.docs){ r=c.docs[id]; if(!f||f(r)) out.push(r); } return out; }
  function need(){ return !c.full||Date.now()-c.full>AGE||!Object.keys(c.docs).length; }
  function tailQ(){ return query(collection(db,COL), where(TSF,'>=',Math.max(0,c.ts-MARGIN))); }
  function seed(){
    return fetch(STATIC_BASE+COL+'.json', {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('json'); return r.json(); }).then(function(j){
      if(!j || j.v!==1 || !Array.isArray(j.docs) || !j.docs.length) throw new Error('json');
      c.docs={}; c.ts=0;
      j.docs.forEach(function(d){ var id=d.id; delete d.id; put(id,strip(d)); });
      c.full=Date.now(); save();
    });
  }
  function fullLoad(){
    if(!HAS_JSON) return dbFull();
    return seed().catch(function(){
      if(Object.keys(c.docs).length){ c.full=Date.now()-AGE+30*6e4; save(); return; }   // hay copia local: sin lectura completa; reintento en 30 min
      return dbFull();
    });
  }
  function dbFull(){ return getDocs(collection(db,COL)).then(function(snap){ c.docs={}; c.ts=0; snap.forEach(function(d){ put(d.id,strip(d.data())); }); c.full=Date.now(); save(); }); }
  return {
    watch:function(f,cb,errCb){
      if(!db) return null; load();
      var unsub=null, dead=false;
      if(Object.keys(c.docs).length){ try{ cb(rows(f)); }catch(e){} }
      function listen(){
        if(dead) return;
        try{
          unsub=onSnapshot(tailQ(), { includeMetadataChanges:true }, function(snap){
            if(snap.metadata.fromCache) return;   // sin servidor no hay datos reales: no pisar la copia guardada
            snap.docChanges().forEach(function(ch){ if(ch.type==='removed') delete c.docs[ch.doc.id]; else put(ch.doc.id,strip(ch.doc.data())); });
            save(); cb(rows(f));
          }, function(){ if(errCb){ try{ errCb(); }catch(e){} } });
        }catch(e){}
      }
      if(need()){ fullLoad().then(function(){ if(dead) return; cb(rows(f)); listen(); }).catch(function(){ if(errCb){ try{ errCb(); }catch(e){} } }); }
      else listen();
      return function(){ dead=true; if(unsub){ try{ unsub(); }catch(e){} unsub=null; } };
    },
    load:async function(f){
      if(!db) return null; load();
      try{
        if(need()) await fullLoad();
        else { var snap=await getDocs(tailQ()); snap.forEach(function(d){ put(d.id,strip(d.data())); }); save(); }
        return rows(f);
      }catch(e){ return null; }
    }
  };
}
var RINC=mkInc('scores_squares','ts','rds_sqr_inc'); window.rdsPrepare=async function(){var rows=await RINC.load(null);if(rows===null)return false;try{var g={};rows.forEach(function(r){var k=[r.mode,r.stim,r.total];var s=JSON.stringify(k);(g[s]=g[s]||{k:k,rows:[]}).rows.push(r);});Object.keys(g).forEach(function(s){var o=g[s];saveRankCache(rankCacheKey(o.k[0],o.k[1],o.k[2]),o.rows);});}catch(e){return false;}return true;};
window.fbWatch=function(mode,stim,total,cb){
  if(!db) return null;
  try{ return RINC.watch(function(r){ return r.mode===mode&&r.stim===stim&&r.total===total; }, cb); }catch(e){ return null; }
};
window.fbLoad=async function(mode,stim,total){
  if(!db) return null;
  return RINC.load(function(r){ return r.mode===mode&&r.stim===stim&&r.total===total; });
};
